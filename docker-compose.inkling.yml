# inkling-small-nvfp4 — TP=2 serve definition for thinkingmachines/Inkling-Small-NVFP4.
# Structure mirrors 2xSPARK-CLUSTER/docker-compose.dspark.yml (single compose, env-driven role:
# NODE_RANK/HEADLESS from render-env.sh, `${VAR:-default}` blocks, bash -lc command).
#
# Serve argv = the official recipe (https://recipes.vllm.ai/thinkingmachines/Inkling-Small)
# plus our multi-node mp-executor wiring and the memory-margin wait loop ported from prod:
# the preamble blocks before exec'ing `vllm serve` until MemAvailable clears util-required +
# MEM_MARGIN_GIB, so a thin-margin node never launches into a doomed NCCL rendezvous
# (prod 2026-07-15 incident class).
# DIVERGENCE FROM RECIPE (2026-07-30): --kernel-config.enable_cutedsl_warmup=False — the
# boot-time cute-dsl warmup spun both GPUs at 96% for 30+ min with no progress logs on
# SM121 (first-boot JIT over all shape buckets). Off = lazy per-shape compile at first
# request instead (observable, one-time per shape).
#
# ███ TRAP: NEVER put '#' comments inside the command: scalar below. It is a folded shell
# ███ string — a '#' comments out EVERYTHING after it (this killed a prod boot 2026-07-28).
# ███ All rationale comments live in cluster.env or here OUTSIDE the scalar.
#
# MTP / reasoning-effort wiring note: the flags are CONDITIONAL and built in the bash preamble
# (SPEC_ARG / KWARG_ARG), not via compose-level ${VAR:+...} — compose does NOT collapse '$$'
# escapes inside ':+' replacement text (verified on compose v5.3.0), so that pattern would have
# passed a literal '$$' to bash. Empty MTP_NUM_TOKENS / REASONING_EFFORT → flag absent; the JSON
# values contain no spaces so unquoted word-splitting of $SPEC_ARG/$KWARG_ARG is safe.
services:
  vllm-inkling:
    image: ${INKLING_VLLM_IMAGE:-vllm/vllm-openai:v0.26.0}
    pull_policy: if_not_present
    entrypoint: []                     # neutralize the baked vllm-serve ENTRYPOINT so bash -lc runs
    container_name: vllm-inkling       # NEVER vllm-dsv4 — that name is prod's single slot
    network_mode: host
    ipc: host
    shm_size: "64gb"

    ulimits:
      memlock: -1
      stack: 67108864

    gpus: all

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${HF_CACHE:-/home/nvidia/hf-cache-inkling}:/cache/huggingface
      # Shim bind-mounted from the kit so shim iterations don't need an image
      # rebuild (the .pth autoloader imports it at interpreter start). To use a
      # hardened FA4 bundle copy instead of the HF-cache stock one, set
      # FA4_BUNDLE_DIR in cluster.env and add a matching bind mount here.
      - ${SHIM_PATH}:/usr/local/lib/python3.12/dist-packages/fa4_sm120_shim.py:ro

    environment:
      # --- HF: offline against the resident cache (weights pre-staged per runbook §3-4) ---
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-1}"
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-1}"
      VLLM_CACHE_ROOT: /cache/huggingface/vllm-cache
      TRITON_CACHE_DIR: /cache/huggingface/triton-cache-inkling
      FLASHINFER_WORKSPACE_BASE: /cache/huggingface/flashinfer

      # --- recipe-required env (vLLM Inkling serving path) ---
      VLLM_USE_V2_MODEL_RUNNER: "1"
      FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED: "1"

      # --- engine safety / arch ---
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "${VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:-600}"
      VLLM_HOST_IP: "${VLLM_HOST_IP:-}"                 # rail-1 IP of this node (render-env sets it per role)
      TRITON_PTXAS_PATH: "${TRITON_PTXAS_PATH:-/usr/local/cuda/bin/ptxas}"
      VLLM_LOGGING_LEVEL: "${VLLM_LOGGING_LEVEL:-INFO}"
      FA4_SM120_BUNDLE_DIR: "${FA4_BUNDLE_DIR:-}"
      PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"

      # --- NCCL / fabric (prod's proven set, copied verbatim) ---
      NCCL_NET: "${NCCL_NET:-IB}"
      NCCL_IB_DISABLE: "${NCCL_IB_DISABLE:-0}"
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME:-enp1s0f1np1}"
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_IB_ADDR_FAMILY: "${NCCL_IB_ADDR_FAMILY:-AF_INET}"
      NCCL_IB_ROCE_VERSION_NUM: "${NCCL_IB_ROCE_VERSION_NUM:-2}"
      NCCL_IB_ADDR_RANGE: "${NCCL_IB_ADDR_RANGE:-}"
      NCCL_CROSS_NIC: "${NCCL_CROSS_NIC:-1}"
      NCCL_IB_MERGE_NICS: "${NCCL_IB_MERGE_NICS:-1}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_IGNORE_CPU_AFFINITY: "${NCCL_IGNORE_CPU_AFFINITY:-1}"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      NCCL_DEBUG_SUBSYS: "${NCCL_DEBUG_SUBSYS:-}"
      NCCL_NVLS_ENABLE: "${NCCL_NVLS_ENABLE:-0}"

      # --- role / rendezvous (from render-env.sh) ---
      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS:-}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25001}"

      # --- lane levers (cluster.env; empty = feature off) ---
      MTP_NUM_TOKENS: "${MTP_NUM_TOKENS:-}"
      REASONING_EFFORT: "${REASONING_EFFORT:-high}"
      MOE_BACKEND: "${MOE_BACKEND:-}"
      DISABLE_CUSTOM_ALL_REDUCE: "${DISABLE_CUSTOM_ALL_REDUCE:-}"
      ENFORCE_EAGER: "${ENFORCE_EAGER:-}"

    command:
      - bash
      - -lc
      - >
        [ -n "$${NCCL_IB_GID_INDEX:-}" ] || unset NCCL_IB_GID_INDEX;
        export PATH="/usr/local/cuda/bin:$${PATH:-}";
        export CUDA_HOME="$${CUDA_HOME:-/usr/local/cuda}";
        export CUDA_PATH="$${CUDA_PATH:-$${CUDA_HOME}}";
        export CUDAToolkit_ROOT="$${CUDAToolkit_ROOT:-$${CUDA_HOME}}";
        export LD_LIBRARY_PATH="/usr/local/cuda/lib64:$${LD_LIBRARY_PATH:-}";
        SPEC_ARG=""; if [ -n "$${MTP_NUM_TOKENS:-}" ]; then SPEC_ARG="--speculative-config {\"method\":\"mtp\",\"num_speculative_tokens\":$${MTP_NUM_TOKENS}}"; fi;
        KWARG_ARG=""; if [ -n "$${REASONING_EFFORT:-}" ]; then KWARG_ARG="--default-chat-template-kwargs {\"reasoning_effort\":\"$${REASONING_EFFORT}\"}"; fi;
        MEMTOTAL_KB="$$(awk '/^MemTotal:/{print $$2}' /proc/meminfo)";
        REQUIRED_KB="$$(awk -v t="$$MEMTOTAL_KB" -v u="${GPU_MEMORY_UTILIZATION:-0.85}" 'BEGIN{printf "%d", t*u}')";
        MARGIN_KB=$$((${MEM_MARGIN_GIB:-3} * 1024 * 1024));
        NEEDED_KB=$$((REQUIRED_KB + MARGIN_KB));
        echo "== waiting for MemAvailable >= $$((NEEDED_KB/1024/1024)) GiB (util=${GPU_MEMORY_UTILIZATION:-0.85} + ${MEM_MARGIN_GIB:-3}GiB margin) before launching vllm serve";
        for i in $$(seq 1 ${MEM_WAIT_MAX_ATTEMPTS:-120}); do
          AVAIL_KB="$$(awk '/^MemAvailable:/{print $$2}' /proc/meminfo)";
          if [ "$$AVAIL_KB" -ge "$$NEEDED_KB" ]; then echo "== memory margin cleared: $$((AVAIL_KB/1024/1024)) GiB available (attempt $$i/${MEM_WAIT_MAX_ATTEMPTS:-120})"; break; fi;
          if [ "$$i" -eq "${MEM_WAIT_MAX_ATTEMPTS:-120}" ]; then echo "== WARNING: memory margin never cleared after ${MEM_WAIT_MAX_ATTEMPTS:-120} attempts; proceeding anyway, vLLM's own memory check will likely fail cleanly"; fi;
          sleep ${MEM_WAIT_POLL_SECONDS:-5};
        done;
        exec /usr/local/bin/vllm serve ${INKLING_MODEL:-thinkingmachines/Inkling-Small-NVFP4}
        --served-model-name ${SERVED_MODEL_NAME:-inkling-small-nvfp4}
        --host ${VLLM_HOST:-127.0.0.1}
        --port ${API_PORT:-8001}
        --trust-remote-code
        --tokenizer-mode inkling
        --reasoning-parser inkling
        --tool-call-parser inkling
        --enable-auto-tool-choice
        --kernel-config.enable_flashinfer_autotune=False
        --kernel-config.enable_cutedsl_warmup=False
        --tensor-parallel-size 2
        --pipeline-parallel-size 1
        --max-model-len ${MAX_MODEL_LEN:-131072}
        --max-num-seqs ${MAX_NUM_SEQS:-8}
        --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-8192}
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.85}
        ${KV_CACHE_MEMORY_BYTES:+--kv-cache-memory-bytes ${KV_CACHE_MEMORY_BYTES}}
        --enable-prefix-caching
        --enable-chunked-prefill
        --distributed-executor-backend mp
        ${MOE_BACKEND:+--moe-backend ${MOE_BACKEND}}
        ${DISABLE_CUSTOM_ALL_REDUCE:+--disable-custom-all-reduce}
        ${ENFORCE_EAGER:+--enforce-eager}
        $${SPEC_ARG}
        $${KWARG_ARG}
        --shutdown-timeout ${SHUTDOWN_TIMEOUT:-0}
        --distributed-timeout-seconds ${DISTRIBUTED_TIMEOUT_SECONDS:-900}
        --cpu-distributed-timeout-seconds ${CPU_DISTRIBUTED_TIMEOUT_SECONDS:-900}
        --nnodes 2
        --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR}
        --master-port ${MASTER_PORT:-25001}
        ${HEADLESS:+--headless}
